<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>君の返事が見たくて</title>
<!-- Google Fonts: Yomogi (手書き風フォント) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    background-color: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Yomogi', 'Hiragino Kaku Gothic ProN', sans-serif;
    overflow: hidden;
  }
  #game-wrapper {
    position: relative;
    width: min(100vw, calc(100vh * 9 / 20));
    height: min(100vh, calc(100vw * 20 / 9));
    background-color: #b8860b;
    box-shadow: 0 0 30px rgba(0,0,0,0.8);
    overflow: hidden;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  /* UI Overlay */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(3px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 10;
  }
  .dialog-box {
    background: #fffdf0;
    border-radius: 12px;
    padding: 20px;
    margin: 10px 0;
    width: 88%;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3), inset 0 0 10px rgba(0,0,0,0.05);
    font-size: 16px;
    line-height: 1.6;
    color: #2c3e50;
    position: relative;
    border: 2px solid #e6d5ac;
  }
  .sticky-note {
    background-color: #fff9a6;
    border-left: 6px solid #f6e05e;
    font-weight: bold;
    color: #4a5568;
    transform: rotate(-1.5deg);
  }
  .start-btn-msg {
    margin-top: 25px;
    color: #fff;
    font-weight: bold;
    font-size: 18px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    animation: blink 1.2s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.97); }
  }

  /* ① & ② 手紙完成ポップアップと注意事項 */
  #readyBanner {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 85%;
    background: rgba(255, 255, 255, 0.95);
    border: 3px solid #ff4b6e;
    border-radius: 16px;
    padding: 15px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    z-index: 6;
    display: none;
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes popIn {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }
  .banner-title {
    font-size: 20px;
    font-weight: bold;
    color: #ff4b6e;
    margin-bottom: 5px;
  }
  .banner-sub {
    font-size: 13px;
    color: #e53e3e;
    font-weight: bold;
  }

  /* ラブレター スライド指示テキスト */
  #slide-guide {
    position: absolute;
    bottom: 20%;
    left: 50%;
    transform: translateX(-50%);
    color: #ffffff;
    font-size: 16px;
    font-weight: bold;
    text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    display: none;
    pointer-events: none;
    z-index: 5;
    animation: blink 1.2s infinite;
    white-space: nowrap;
    text-align: center;
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <canvas id="gameCanvas"></canvas>
  
  <!-- ① 手紙完成を伝えるポップアップ -->
  <div id="readyBanner">
    <div class="banner-title">💌 手紙が完成した！</div>
    <div class="banner-sub">⚠️ 先生が後ろを向いた隙に渡そう！</div>
  </div>

  <!-- ② スライド誘導ガイド（注意喚起を追加） -->
  <div id="slide-guide">
    👈 横にスライドして渡そう！ 👉
  </div>

  <!-- スタート画面 -->
  <div id="startOverlay" class="overlay">
    <div class="dialog-box sticky-note">
      「好きな人いる？」
    </div>
    <div class="dialog-box">
      隣の子からもらった...！<br>これは絶対に返事を返さないと！
    </div>
    <div class="start-btn-msg">タップでゲームスタート</div>
  </div>

  <!-- ゲームオーバー画面 -->
  <div id="gameoverOverlay" class="overlay" style="display: none;">
    <div class="dialog-box" style="text-align: center; color: #e53e3e; font-weight: bold; font-size: 18px;">
      先生に見つかった！<br><span style="font-size: 14px; color: #666;">(または鉛筆を落とした)</span>
    </div>
    <div class="start-btn-msg">タップしてリトライ</div>
  </div>

  <!-- クリア画面 -->
  <div id="clearOverlay" class="overlay" style="display: none;">
    <div class="dialog-box sticky-note" style="text-align: center; font-size: 20px;">
      「私もです。」
    </div>
    <div class="dialog-box" style="text-align: center; color: #38a169; font-weight: bold; margin-top: 15px;">
      手紙の交換に成功した！
    </div>
    <div class="start-btn-msg">タップしてもう一度遊ぶ</div>
  </div>
</div>

<script>
// --- Web Audio API サウンドシステム ---
class SoundSystem {
  constructor() {
    this.ctx = null;
    this.bgmInterval = null;
    this.bgmStep = 0;
    this.currentBgmType = 'normal';
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  playBlockHit() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1046.50, this.ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.08);
  }

  playPaddleHit() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(220, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 0.06);
    gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.06);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.06);
  }

  playReadyChime() {
    if (!this.ctx) return;
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
      gain.gain.setValueAtTime(0.25, this.ctx.currentTime + idx * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.3);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(this.ctx.currentTime + idx * 0.08);
      osc.stop(this.ctx.currentTime + idx * 0.08 + 0.3);
    });
  }

  playPassSound() {
    if (!this.ctx) return;
    const bufferSize = this.ctx.sampleRate * 0.15;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;
    
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(400, this.ctx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.15);
    
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    noise.start();
  }

  playGameOver() {
    if (!this.ctx) return;
    this.stopBgm();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, this.ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(80, this.ctx.currentTime + 0.5);
    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.5);
  }

  playClear() {
    if (!this.ctx) return;
    this.stopBgm();
    const notes = [523.25, 659.25, 783.99, 987.77, 1046.50];
    notes.forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.1);
      gain.gain.setValueAtTime(0.3, this.ctx.currentTime + idx * 0.1);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.1 + 0.4);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(this.ctx.currentTime + idx * 0.1);
      osc.stop(this.ctx.currentTime + idx * 0.1 + 0.4);
    });
  }

  startBgm(type = 'normal') {
    if (this.bgmInterval) {
      if (this.currentBgmType === type) return;
      this.stopBgm();
    }
    this.currentBgmType = type;
    this.bgmStep = 0;

    const normalMelody = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 349.23, 440.00];
    const tenseMelody  = [130.81, 138.59, 130.81, 123.47];

    this.bgmInterval = setInterval(() => {
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      if (type === 'normal') {
        const freq = normalMelody[this.bgmStep % normalMelody.length];
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.18);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.18);
      } else {
        const freq = tenseMelody[this.bgmStep % tenseMelody.length];
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.25);
      }

      osc.connect(gain);
      gain.connect(this.ctx.destination);

      this.bgmStep++;
    }, type === 'normal' ? 220 : 300);
  }

  stopBgm() {
    if (this.bgmInterval) {
      clearInterval(this.bgmInterval);
      this.bgmInterval = null;
    }
  }
}

const sounds = new SoundSystem();

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const wrapper = document.getElementById('game-wrapper');

const startOverlay = document.getElementById('startOverlay');
const gameoverOverlay = document.getElementById('gameoverOverlay');
const clearOverlay = document.getElementById('clearOverlay');
const slideGuide = document.getElementById('slide-guide');
const readyBanner = document.getElementById('readyBanner');

let W = 0, H = 0;
function resize() {
  W = canvas.width = wrapper.clientWidth;
  H = canvas.height = wrapper.clientHeight;
}
resize();
window.addEventListener('resize', resize);

let gameState = 'START'; 
let loveGauge = 0; 
let teacherFacingFront = false;
let teacherAlert = false; 
let teacherAlertText = '...！';
let teacherTimer = null;
let letterPassStartTime = 0;

// ボール（鉛筆）
const ball = {
  x: 0, y: 0,
  vx: 0, vy: 0,
  radius: 8,
  baseSpeed: 0,
  visible: true,
  angle: 0
};

// バー（ラブレター）
const paddle = {
  x: 0, y: 0,
  w: 0, h: 0
};

// パーティクル配列
let particles = [];

// ブロック配列および天井位置
let blocks = [];
const COLS = 5;
const ROWS = 4;
const TOTAL_BLOCKS = COLS * ROWS; 
let topCeilingY = 0; 

// 手紙スライド用変数
let isDraggingLetter = false;
let startDragX = 0;
let paddleStartX = 0;

function createExplosion(x, y) {
  particles.push({
    x: x, y: y,
    vx: (Math.random() - 0.5) * 4,
    vy: -2 - Math.random() * 2,
    life: 1.0,
    size: 4 + Math.random() * 3,
    color: '#ff4b6e'
  });
  particles.push({
    x: x, y: y,
    vx: (Math.random() - 0.5) * 5,
    vy: (Math.random() - 0.5) * 5,
    life: 1.0,
    size: 2 + Math.random() * 2,
    color: '#ffdae9'
  });
}

function initGame() {
  sounds.init();
  sounds.startBgm('normal');

  loveGauge = 0;
  teacherFacingFront = false;
  teacherAlert = false;
  ball.visible = true;
  gameState = 'PLAYING';
  particles = [];
  isDraggingLetter = false;

  paddle.w = W * 0.22;
  paddle.h = paddle.w * 0.55;
  paddle.x = (W - paddle.w) / 2;
  paddle.y = H * 0.85;

  ball.radius = Math.max(7, W * 0.02);
  ball.x = W / 2;
  ball.y = paddle.y - 20;
  
  ball.baseSpeed = H * 0.009;
  
  const angle = -Math.PI / 4 - (Math.random() * Math.PI / 2);
  ball.vx = Math.cos(angle) * ball.baseSpeed;
  ball.vy = Math.sin(angle) * ball.baseSpeed;

  blocks = [];
  const bw = (W * 0.85) / COLS;
  const bh = H * 0.035;
  const startX = (W - bw * COLS) / 2;
  const startY = H * 0.28;

  topCeilingY = startY - 8;

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      blocks.push({
        x: startX + c * bw,
        y: startY + r * bh,
        w: bw - 1,
        h: bh - 1,
        alive: true
      });
    }
  }

  slideGuide.style.display = 'none';
  readyBanner.style.display = 'none';
  scheduleTeacher();
}

function scheduleTeacher() {
  if (teacherTimer) clearTimeout(teacherTimer);
  if (gameState === 'CLEAR' || gameState === 'GAMEOVER') return;

  let delay = teacherFacingFront 
    ? (3000 + Math.random() * 4000)  
    : (5000 + Math.random() * 7000); 

  const randPattern = Math.random();
  if (randPattern < 0.15) {
    delay *= 0.3;
  } else if (randPattern > 0.85) {
    delay *= 1.8;
  }

  if (teacherFacingFront) {
    if (Math.random() < 0.5) {
      teacherTimer = setTimeout(() => {
        teacherAlert = true;
        teacherAlertText = '...？';
        
        teacherTimer = setTimeout(() => {
          if (Math.random() < 0.5) {
            teacherFacingFront = false;
            setTimeout(() => {
              setTeacherState(true);
              teacherAlert = false;
              scheduleTeacher();
            }, 500);
          } else {
            teacherAlert = false;
            setTeacherState(false);
            scheduleTeacher();
          }
        }, 800 + Math.random() * 600);

      }, delay);
    } else {
      teacherTimer = setTimeout(() => {
        setTeacherState(false);
        scheduleTeacher();
      }, delay);
    }
  } else {
    if (Math.random() < 0.5) {
      teacherTimer = setTimeout(() => {
        teacherAlert = true;
        teacherAlertText = '...！';
        
        teacherTimer = setTimeout(() => {
          teacherAlert = false;
          if (Math.random() < 0.65) {
            setTeacherState(true);
          }
          scheduleTeacher();
        }, 800 + Math.random() * 800);

      }, delay);
    } else {
      teacherTimer = setTimeout(() => {
        setTeacherState(true);
        scheduleTeacher();
      }, delay);
    }
  }
}

function setTeacherState(front) {
  teacherFacingFront = front;

  if (gameState === 'PLAYING') {
    if (teacherFacingFront) {
      sounds.startBgm('tense');
    } else {
      sounds.startBgm('normal');
    }
  }

  if (gameState === 'LETTER_PASSING' && teacherFacingFront) {
    triggerGameOver();
  }
}

// パドル移動 / ドラッグ操作
function handlePointerDown(clientX) {
  if (gameState === 'LETTER_READY') {
    isDraggingLetter = true;
    startDragX = clientX;
    paddleStartX = paddle.x;
  }
}

function handlePointerMove(clientX) {
  if (gameState === 'PLAYING') {
    const rect = canvas.getBoundingClientRect();
    const touchX = clientX - rect.left;
    paddle.x = Math.max(0, Math.min(W - paddle.w, touchX - paddle.w / 2));
  } else if (gameState === 'LETTER_READY' && isDraggingLetter) {
    const diffX = clientX - startDragX;
    paddle.x = paddleStartX + diffX;

    if (Math.abs(paddle.x - (W - paddle.w) / 2) > W * 0.3) {
      isDraggingLetter = false;
      readyBanner.style.display = 'none';
      slideGuide.style.display = 'none';
      sounds.playPassSound();
      gameState = 'LETTER_PASSING';
      letterPassStartTime = Date.now();
    }
  }
}

function handlePointerUp() {
  if (gameState === 'LETTER_READY' && isDraggingLetter) {
    isDraggingLetter = false;
    paddle.x = (W - paddle.w) / 2;
  }
}

window.addEventListener('mousedown', e => handlePointerDown(e.clientX));
window.addEventListener('mousemove', e => handlePointerMove(e.clientX));
window.addEventListener('mouseup', handlePointerUp);

window.addEventListener('touchstart', e => {
  if (e.touches.length > 0) handlePointerDown(e.touches[0].clientX);
}, { passive: true });
window.addEventListener('touchmove', e => {
  if (e.touches.length > 0) handlePointerMove(e.touches[0].clientX);
}, { passive: true });
window.addEventListener('touchend', handlePointerUp);

startOverlay.addEventListener('click', () => {
  startOverlay.style.display = 'none';
  initGame();
});

gameoverOverlay.addEventListener('click', () => {
  gameoverOverlay.style.display = 'none';
  initGame();
});

clearOverlay.addEventListener('click', () => {
  clearOverlay.style.display = 'none';
  initGame();
});

function triggerGameOver() {
  gameState = 'GAMEOVER';
  if (teacherTimer) clearTimeout(teacherTimer);
  sounds.playGameOver();
  readyBanner.style.display = 'none';
  slideGuide.style.display = 'none';
  gameoverOverlay.style.display = 'flex';
}

function triggerClear() {
  gameState = 'CLEAR';
  if (teacherTimer) clearTimeout(teacherTimer);
  sounds.playClear();
  readyBanner.style.display = 'none';
  slideGuide.style.display = 'none';
  clearOverlay.style.display = 'flex';
}

// 更新処理
function update() {
  if (gameState === 'START' || gameState === 'GAMEOVER' || gameState === 'CLEAR') return;

  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.04;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (ball.visible) {
    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.angle = Math.atan2(ball.vy, ball.vx);

    if (ball.x - ball.radius < 0) { ball.x = ball.radius; ball.vx *= -1; }
    if (ball.x + ball.radius > W) { ball.x = W - ball.radius; ball.vx *= -1; }
    
    if (ball.y - ball.radius < topCeilingY) { 
      ball.y = topCeilingY + ball.radius; 
      ball.vy *= -1; 
    }

    if (ball.y - ball.radius > H) {
      triggerGameOver();
      return;
    }

    // バー（ラブレター）反発
    if (
      ball.y + ball.radius >= paddle.y &&
      ball.y - ball.radius <= paddle.y + paddle.h &&
      ball.x >= paddle.x &&
      ball.x <= paddle.x + paddle.w &&
      ball.vy > 0
    ) {
      sounds.playPaddleHit();
      ball.vy *= -1;
      const hitPos = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      ball.vx = hitPos * ball.baseSpeed * 1.2;
    }

    // ブロック衝突判定
    let hitOccurred = false;
    for (let b of blocks) {
      if (!b.alive) continue;

      const closestX = Math.max(b.x, Math.min(ball.x, b.x + b.w));
      const closestY = Math.max(b.y, Math.min(ball.y, b.y + b.h));

      const distX = ball.x - closestX;
      const distY = ball.y - closestY;
      const distanceSquared = (distX * distX) + (distY * distY);

      if (distanceSquared < (ball.radius * ball.radius)) {
        b.alive = false;
        hitOccurred = true;

        sounds.playBlockHit();
        createExplosion(b.x + b.w / 2, b.y + b.h / 2);

        const overlapLeft = (ball.x + ball.radius) - b.x;
        const overlapRight = (b.x + b.w) - (ball.x - ball.radius);
        const overlapTop = (ball.y + ball.radius) - b.y;
        const overlapBottom = (b.y + b.h) - (ball.y - ball.radius);

        const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

        if (minOverlap === overlapTop || minOverlap === overlapBottom) {
          ball.vy *= -1;
        } else {
          ball.vx *= -1;
        }
        break; 
      }
    }

    if (hitOccurred) {
      const remainingBlocks = blocks.filter(blk => blk.alive).length;
      const brokenBlocks = TOTAL_BLOCKS - remainingBlocks;
      
      loveGauge = Math.min(100, Math.floor((brokenBlocks / TOTAL_BLOCKS) * 100));

      if (remainingBlocks === 0 && gameState === 'PLAYING') {
        loveGauge = 100;
        gameState = 'LETTER_READY';
        sounds.playReadyChime();
        ball.visible = false; 
        
        paddle.x = (W - paddle.w) / 2;
        readyBanner.style.display = 'block';
        slideGuide.style.display = 'block';

        teacherAlert = false;
        setTeacherState(true);
        scheduleTeacher(); 
      }
    }
  }

  if (gameState === 'LETTER_PASSING') {
    if (Date.now() - letterPassStartTime > 800) {
      if (!teacherFacingFront) {
        triggerClear();
      } else {
        triggerGameOver();
      }
    }
  }
}

// 木目背景描画
function drawDeskBackground() {
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, '#c79c5e');
  grad.addColorStop(0.5, '#b08244');
  grad.addColorStop(1, '#936831');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(80, 45, 10, 0.08)';
  ctx.lineWidth = 4;
  for (let i = -100; i < H + 100; i += 25) {
    ctx.beginPath();
    ctx.moveTo(0, i);
    ctx.bezierCurveTo(W * 0.3, i + 15, W * 0.7, i - 15, W, i + 5);
    ctx.stroke();
  }
}

// 鉛筆の描画
function drawPencil(x, y, radius, angle) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle + Math.PI / 2);

  const len = radius * 3.8;
  const w = radius * 1.6;

  ctx.fillStyle = '#f6ad2b';
  ctx.fillRect(-w / 2, -len / 2, w, len * 0.7);

  ctx.fillStyle = '#e2d8b1';
  ctx.beginPath();
  ctx.moveTo(-w / 2, len * 0.2);
  ctx.lineTo(0, len / 2 + 3);
  ctx.lineTo(w / 2, len * 0.2);
  ctx.fill();

  ctx.fillStyle = '#2d3748';
  ctx.beginPath();
  ctx.moveTo(-w * 0.2, len * 0.38);
  ctx.lineTo(0, len / 2 + 3);
  ctx.lineTo(w * 0.2, len * 0.38);
  ctx.fill();

  ctx.fillStyle = '#cbd5e0';
  ctx.fillRect(-w / 2, -len / 2 - 3, w, 4);
  ctx.fillStyle = '#feb2b2';
  ctx.fillRect(-w / 2, -len / 2 - 8, w, 5);

  ctx.restore();
}

// 先生の描画
function drawTeacherImage(ctx, x, y, w, h, front, alert) {
  ctx.save();
  ctx.translate(x, y);

  ctx.fillStyle = '#3182ce';
  ctx.fillRect(w * 0.3, h * 0.5, w * 0.4, h * 0.5);

  ctx.fillStyle = '#fbd38d';
  ctx.beginPath();
  ctx.arc(w * 0.5, h * 0.35, w * 0.18, 0, Math.PI * 2);
  ctx.fill();

  if (front) {
    ctx.fillStyle = '#2d3748';
    ctx.beginPath();
    ctx.arc(w * 0.5, h * 0.28, w * 0.18, Math.PI, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#1a202c';
    ctx.lineWidth = 2;
    ctx.strokeRect(w * 0.38, h * 0.3, w * 0.1, h * 0.08);
    ctx.strokeRect(w * 0.52, h * 0.3, w * 0.1, h * 0.08);

    ctx.fillStyle = '#e53e3e';
    ctx.beginPath();
    ctx.arc(w * 0.43, h * 0.34, 2, 0, Math.PI * 2);
    ctx.arc(w * 0.57, h * 0.34, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(w * 0.5, h * 0.45, w * 0.08, Math.PI, Math.PI * 2);
    ctx.stroke();

  } else {
    ctx.fillStyle = '#2d3748';
    ctx.beginPath();
    ctx.arc(w * 0.5, h * 0.33, w * 0.19, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#d69e2e';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(w * 0.65, h * 0.6);
    ctx.lineTo(w * 0.85, h * 0.25);
    ctx.stroke();
  }

  if (alert) {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(w * 0.6, h * 0.05, w * 0.35, h * 0.25);
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 1;
    ctx.strokeRect(w * 0.6, h * 0.05, w * 0.35, h * 0.25);
    ctx.fillStyle = '#e53e3e';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(teacherAlertText, w * 0.77, h * 0.2);
  }

  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, W, H);

  // 1. 机背景
  drawDeskBackground();

  // 2. 黒板と先生
  const teacherBox = { x: 12, y: 12, w: W * 0.45, h: H * 0.18 };
  ctx.fillStyle = '#2d5a27';
  ctx.fillRect(teacherBox.x, teacherBox.y, teacherBox.w, teacherBox.h);
  ctx.strokeStyle = '#8b5a2b';
  ctx.lineWidth = 4;
  ctx.strokeRect(teacherBox.x, teacherBox.y, teacherBox.w, teacherBox.h);

  drawTeacherImage(
    ctx, 
    teacherBox.x, 
    teacherBox.y, 
    teacherBox.w, 
    teacherBox.h, 
    teacherFacingFront, 
    teacherAlert
  );

  // 3. 愛ゲージ
  const gaugeBox = { x: W - 65, y: 15, w: 48, h: H * 0.16 };
  
  ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(gaugeBox.x, gaugeBox.y, gaugeBox.w, gaugeBox.h, 12);
  ctx.fill();
  ctx.stroke();

  const fillH = (gaugeBox.h - 8) * (loveGauge / 100);
  if (fillH > 0) {
    const gaugeGrad = ctx.createLinearGradient(0, gaugeBox.y + gaugeBox.h, 0, gaugeBox.y);
    gaugeGrad.addColorStop(0, '#ff4b6e');
    gaugeGrad.addColorStop(1, '#ff758c');
    ctx.fillStyle = gaugeGrad;
    ctx.beginPath();
    ctx.roundRect(
      gaugeBox.x + 4, 
      gaugeBox.y + gaugeBox.h - 4 - fillH, 
      gaugeBox.w - 8, 
      fillH, 
      8
    );
    ctx.fill();
  }

  ctx.font = '22px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('❤️', gaugeBox.x + gaugeBox.w / 2, gaugeBox.y - 12);

  // 4. ブロック描画
  blocks.forEach(b => {
    if (!b.alive) return;
    
    ctx.fillStyle = '#fff0f5';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#ffb6c1';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(b.x, b.y, b.w, b.h);

    ctx.font = `${Math.floor(b.h * 0.65)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('❤️', b.x + b.w / 2, b.y + b.h / 2);
  });

  // 5. パーティクル描画
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  // 6. 鉛筆（ボール）描画
  if (ball.visible) {
    drawPencil(ball.x, ball.y, ball.radius, ball.angle);
  }

  // 7. ラブレター（パドル）描画
  if (gameState !== 'LETTER_PASSING') {
    ctx.save();
    ctx.translate(paddle.x, paddle.y);
    
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(0,0,0,0.2)';
    ctx.shadowBlur = 8;
    ctx.fillRect(0, 0, paddle.w, paddle.h);
    ctx.shadowBlur = 0;

    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(paddle.w / 2, paddle.h * 0.6);
    ctx.lineTo(paddle.w, 0);
    ctx.stroke();

    ctx.fillStyle = '#ff4b6e';
    ctx.font = `${Math.floor(paddle.h * 0.55)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('❤️', paddle.w / 2, paddle.h / 2 + 2);

    ctx.restore();
  }

  // 8. ノート・教科書（先生が前を向いている時）
  if (teacherFacingFront) {
    const bookY = H * 0.25;
    const bookW = W * 0.82;
    const bookH = H * 0.46;
    const bookX = (W - bookW) / 2;
    
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(bookX + 5, bookY + 5, bookW, bookH);

    ctx.fillStyle = '#fcfdfa';
    ctx.fillRect(bookX, bookY, bookW, bookH);
    ctx.strokeStyle = '#d0d7de';
    ctx.lineWidth = 2;
    ctx.strokeRect(bookX, bookY, bookW, bookH);

    ctx.beginPath();
    ctx.moveTo(W / 2, bookY);
    ctx.lineTo(W / 2, bookY + bookH);
    ctx.strokeStyle = '#b0b8c0';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#a2c4c9';
    for (let i = 0; i < 7; i++) {
      ctx.fillRect(bookX + 10, bookY + 30 + i * 20, bookW / 2 - 20, 1);
      ctx.fillRect(W / 2 + 10, bookY + 30 + i * 20, bookW / 2 - 20, 1);
    }

    ctx.fillStyle = '#ffa0a0';
    ctx.fillRect(bookX + 25, bookY, 1, bookH);
    ctx.fillRect(W / 2 + 25, bookY, 1, bookH);
  }
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
